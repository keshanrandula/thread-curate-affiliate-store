<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tc-brand-gradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="45%" stopColor="#F97316" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
    <linearGradient id="tc-rim-gradient" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDE68A" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#F59E0B" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#EA580C" stopOpacity="0.6" />
    </linearGradient>
    <linearGradient id="tc-thread-gold" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="40%" stopColor="#FEF3C7" />
      <stop offset="100%" stopColor="#FDE68A" />
    </linearGradient>
    <filter id="tc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#7C2D12" floodOpacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Badge Background -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#tc-brand-gradient)" />

  <!-- Metallic Gold Border Highlight -->
  <rect x="3.5" y="3.5" width="41" height="41" rx="11.5" stroke="url(#tc-rim-gradient)" strokeWidth="1.2" />

  <!-- Inner Subtle Textile Weave Grid Accents -->
  <path d="M7 16H41M7 32H41M16 7V41M32 7V41" stroke="#FFFFFF" strokeOpacity="0.06" strokeWidth="1" strokeDasharray="2 3" />

  <!-- Monogram Emblem -->
  <g filter="url(#tc-glow)">
    <!-- Woven T Strand -->
    <path d="M 13 16.5 C 13 15.67 13.67 15 14.5 15 H 31.5 C 32.33 15 33 15.67 33 16.5 C 33 17.33 32.33 18 31.5 18 H 25.5 V 28.5 C 25.5 31.5 28 32.5 30 31.5 C 30.7 31.15 31.2 31.7 30.9 32.4 C 29.5 35 23.5 35 22.5 30 V 18 H 14.5 C 13.67 18 13 17.33 13 16.5 Z" fill="url(#tc-thread-gold)" />

    <!-- Interlocking C Ribbon -->
    <path d="M 33 21.5 C 33.5 22.2 33.1 23 32.2 23.2 C 29.5 23.8 28.5 25 28.5 27 C 28.5 29.8 30.5 31 33 30.5 C 33.8 30.3 34.3 31.1 33.8 31.8 C 30.8 35.5 22 34 20.5 28 C 19.2 23 23.5 18.5 30.5 18.5 C 32 18.5 33.5 19 34.2 19.5 C 34.8 20 34.6 20.8 33.9 21.2 L 33 21.5 Z" fill="#FFFFFF" fillOpacity="0.95" />

    <!-- Needle Eye -->
    <ellipse cx="24" cy="16.5" rx="1.2" ry="2" fill="#7C2D12" fillOpacity="0.45" />

    <!-- Curation Sparkle -->
    <path d="M 35 8 C 35 11 38 11 38 11 C 38 11 35 11 35 14 C 35 11 32 11 32 11 C 32 11 35 11 35 8 Z" fill="#FEF3C7" />
    <circle cx="35" cy="11" r="0.75" fill="#FFFFFF" />
  </g>
</svg>
